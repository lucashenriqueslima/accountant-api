name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Os tipos do Prisma Client são gerados — sem isso o build da API não compila.
      - name: Gerar Prisma Client
        run: pnpm --filter @forte/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Build da API
        run: pnpm --filter @forte/api build

      - name: Build do front
        run: pnpm --filter @forte/app build
